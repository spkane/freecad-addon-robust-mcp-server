name: GUI Tests

on:
  push:
    branches: [main, master]
    paths:
      - "src/**/*.py"
      - "freecad/**/*.py"
      - "tests/**/*.py"
      - "tests/ci-test/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-gui.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**/*.py"
      - "freecad/**/*.py"
      - "tests/**/*.py"
      - "tests/ci-test/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-gui.yaml"
  schedule:
    # Exercise the newest FreeCAD weekly even when this repository is quiet.
    - cron: "17 9 * * 3"
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-integration-test:
    name: GUI (${{ matrix.display_name }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: qt5-stable
            display_name: FreeCAD 1.0.2 / Qt5
            release: "1.0.2"
            expected_binding: PySide2
            experimental: false
          - id: qt6-stable
            display_name: latest stable / Qt6
            release: latest-stable
            expected_binding: PySide6
            experimental: false
          - id: qt6-weekly
            display_name: latest weekly / Qt6 canary
            release: latest-weekly
            expected_binding: PySide6
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve FreeCAD release
        id: freecad-release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ matrix.release }}
          TARGET_ARCH: x86_64
        run: |
          if [[ "$REQUESTED_RELEASE" == "latest-stable" ]]; then
            RELEASE_INFO=$(gh api repos/FreeCAD/FreeCAD/releases/latest)
          elif [[ "$REQUESTED_RELEASE" == "latest-weekly" ]]; then
            RELEASES=$(gh api 'repos/FreeCAD/FreeCAD/releases?per_page=30')
            RELEASE_INFO=$(jq -c \
              '[.[] | select(.prerelease == true and (.tag_name | startswith("weekly-")))][0]' \
              <<< "$RELEASES")
          else
            RELEASE_INFO=$(gh api \
              "repos/FreeCAD/FreeCAD/releases/tags/$REQUESTED_RELEASE")
          fi

          TAG=$(jq -r '.tag_name' <<< "$RELEASE_INFO")
          ASSET=$(jq -c --arg arch "$TARGET_ARCH" \
            '[.assets[] | select(.name | test("Linux-" + $arch + ".*\\.AppImage$"))][0]' \
            <<< "$RELEASE_INFO")
          URL=$(jq -r '.browser_download_url' <<< "$ASSET")
          DIGEST=$(jq -r '.digest' <<< "$ASSET")

          if [[ -z "$TAG" || "$TAG" == "null" ||
                -z "$URL" || "$URL" == "null" ||
                ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve a verified Linux AppImage for $REQUESTED_RELEASE" >&2
            echo "Release tag: $TAG" >&2
            echo "Asset: $ASSET" >&2
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "url=$URL"
            echo "sha256=${DIGEST#sha256:}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $REQUESTED_RELEASE to $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build GUI test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/ci-test/Dockerfile.gui-test
          push: false
          load: true
          tags: freecad-gui-test:${{ matrix.id }}
          build-args: |
            FREECAD_TAG=${{ steps.freecad-release.outputs.tag }}
            FREECAD_APPIMAGE_URL=${{ steps.freecad-release.outputs.url }}
            FREECAD_APPIMAGE_SHA256=${{ steps.freecad-release.outputs.sha256 }}
          cache-from: type=gha,scope=freecad-gui-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=freecad-gui-${{ matrix.id }}

      - name: Run GUI integration tests
        run: |
          # Create output directory for artifacts
          mkdir -p test-output

          # Run tests in container with workspace mounted
          # The container has Xvfb, openbox, and FreeCAD pre-installed
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/test-output:/test-output" \
            -w /workspace \
            -e DISPLAY=:99 \
            -e QT_QPA_PLATFORM=xcb \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e XDG_RUNTIME_DIR=/tmp/runtime-root \
            -e EXPECTED_QT_BINDING=${{ matrix.expected_binding }} \
            -e FREECAD_TEST_RELEASE=${{ steps.freecad-release.outputs.tag }} \
            freecad-gui-test:${{ matrix.id }} \
            /bin/bash -c '
              set -e

              # Setup XDG runtime dir
              mkdir -p /tmp/runtime-root
              chmod 700 /tmp/runtime-root

              # Start Xvfb
              echo "Starting Xvfb..."
              Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
              XVFB_PID=$!
              sleep 2

              # Start openbox window manager (required for FreeCAD GUI)
              echo "Starting openbox..."
              openbox &
              sleep 1

              # Verify X11 display
              echo "Verifying X11 display..."
              xdpyinfo -display :99 | head -3

              # Install project dependencies
              echo "Installing dependencies..."
              uv sync --all-extras
              uv run freecad-mcp --pair-bridge

              # Start FreeCAD GUI with MCP bridge
              echo "Starting FreeCAD GUI with MCP bridge..."
              freecad freecad/RobustMCPBridge/freecad_mcp_bridge/blocking_bridge.py > /test-output/freecad_bridge.log 2>&1 &
              FREECAD_PID=$!

              # Start xdotool events in background to help FreeCAD GUI initialization
              (
                for j in {1..120}; do
                  xdotool mousemove $((400 + j*3)) $((300 + j*3)) click 1 key Escape 2>/dev/null || true
                  sleep 0.5
                done
              ) &
              XDOT_PID=$!

              # Wait for MCP bridge to be ready
              echo "Waiting for MCP bridge..."
              MAX_RETRIES=90
              BRIDGE_READY=0
              for i in $(seq 1 $MAX_RETRIES); do
                if ! ps -p $FREECAD_PID > /dev/null 2>&1; then
                  echo "ERROR: FreeCAD process died after ${i}s"
                  cat /test-output/freecad_bridge.log || true
                  exit 1
                fi

                # Check XML-RPC endpoint
                if uv run python -c "from tests.integration.auth_support import integration_proxy; print(integration_proxy().ping())" 2>/dev/null | grep -q "pong"; then
                  echo "MCP bridge is ready after ${i}s!"
                  BRIDGE_READY=1
                  break
                fi

                if [ $((i % 10)) -eq 0 ]; then
                  echo "Still waiting... (${i}s)"
                fi
                sleep 1
              done

              if [ "$BRIDGE_READY" -ne 1 ]; then
                echo "ERROR: MCP bridge did not start within ${MAX_RETRIES}s"
                cat /test-output/freecad_bridge.log || true
                kill $XDOT_PID 2>/dev/null || true
                kill $FREECAD_PID 2>/dev/null || true
                exit 1
              fi

              # Verify GUI mode is active
              echo "Verifying GUI mode..."
              RESULT=$(uv run python -c "from tests.integration.auth_support import integration_proxy; print(integration_proxy().execute(\"_result_ = FreeCAD.GuiUp\"))")
              echo "GuiUp check result: $RESULT"

              if ! echo "$RESULT" | grep -q "true\|True\|1"; then
                echo "ERROR: FreeCAD GUI mode not active"
                cat /test-output/freecad_bridge.log || true
                kill $XDOT_PID 2>/dev/null || true
                kill $FREECAD_PID 2>/dev/null || true
                exit 1
              fi

              echo "FreeCAD GUI mode confirmed!"

              # Run GUI integration tests (excluding standalone tests)
              echo "Running GUI integration tests..."
              uv run pytest tests/integration/ -v --tb=short -x \
                -m "not standalone_freecad" \
                --junit-xml=/test-output/gui-test-results.xml \
                || TEST_EXIT=$?

              # Copy any screenshots to output
              cp /tmp/*.png /test-output/ 2>/dev/null || true
              cp /tmp/*.FCStd /test-output/ 2>/dev/null || true

              # Cleanup - stop the FreeCAD process that was running for GUI tests
              echo "Stopping FreeCAD for GUI tests..."
              kill $XDOT_PID 2>/dev/null || true
              kill $FREECAD_PID 2>/dev/null || true
              sleep 2  # Give it time to shut down

              # Now run standalone tests (shutdown crash tests) - these manage their own FreeCAD
              if [ "${TEST_EXIT:-0}" -eq 0 ]; then
                echo ""
                echo "Running standalone FreeCAD tests (shutdown crash detection)..."
                uv run pytest tests/integration/test_shutdown_crash.py -v --tb=short \
                  --junit-xml=/test-output/shutdown-test-results.xml \
                  || TEST_EXIT=$?
              else
                echo "Skipping standalone tests due to earlier failures"
              fi

              exit ${TEST_EXIT:-0}
            '

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-test-artifacts-${{ matrix.id }}
          path: test-output/
          retention-days: 7

      - name: Show bridge log on failure
        if: failure()
        run: |
          echo "=== FreeCAD Bridge Log ==="
          cat test-output/freecad_bridge.log 2>/dev/null || echo "No log file found"

      - name: Report canary result
        if: always() && matrix.experimental
        env:
          JOB_STATUS: ${{ job.status }}
          FREECAD_TAG: ${{ steps.freecad-release.outputs.tag }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            {
              echo "### FreeCAD weekly canary passed"
              echo "Tested $FREECAD_TAG with PySide6."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=FreeCAD weekly canary failed::$FREECAD_TAG failed the non-blocking Qt6 GUI compatibility lane. Review this job and its artifacts."
            {
              echo "### FreeCAD weekly canary failed"
              echo "$FREECAD_TAG failed the non-blocking Qt6 GUI compatibility lane."
              echo "Review the bridge log and JUnit artifacts from this job."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
