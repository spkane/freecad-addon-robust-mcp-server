name: Docker Build

# Build and test Docker images on pushes to main and pull requests.
# Note: Release tags (robust-mcp-server-v*) trigger mcp-server-release.yaml
# which handles Docker Hub releases. This workflow is for CI testing only.
on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/smoke_container.py"
      - ".github/workflows/docker.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/smoke_container.py"
      - ".github/workflows/docker.yaml"
  workflow_dispatch:
  workflow_call:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: freecad-robust-mcp

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install smoke-test dependencies
        run: uv sync --locked --all-extras

      - name: Set up FreeCAD for the container smoke test
        uses: ./.github/actions/setup-freecad

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Get version for setuptools-scm
        id: version
        run: |
          # Get version from git describe (matches setuptools-scm behavior)
          # For tagged releases: v1.0.0 -> 1.0.0
          # For dev builds: v1.0.0-5-g1234567 -> 1.0.0.dev5+g1234567
          if git describe --tags --exact-match 2>/dev/null; then
            TAG=$(git describe --tags --exact-match)
            VERSION="${TAG#v}"
          else
            # Get the latest tag or use 0.0.0 if none exists
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            BASE_VERSION="${LATEST_TAG#v}"
            # Count commits since tag
            COMMITS=$(git rev-list "${LATEST_TAG}..HEAD" --count 2>/dev/null || echo "0")
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${BASE_VERSION}.dev${COMMITS}+g${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          # Build for current platform only for testing (--no-cache ensures fresh build)
          docker build --no-cache --build-arg VERSION=${{ steps.version.outputs.VERSION }} -t ${{ env.IMAGE_NAME }}:test .
          uv run --no-sync freecad-mcp --pair-bridge
          setsid freecadcmd freecad/RobustMCPBridge/freecad_mcp_bridge/blocking_bridge.py > /tmp/freecad_bridge.log 2>&1 &
          FREECAD_PID=$!
          trap 'kill -- "-$FREECAD_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if uv run --no-sync python -c 'from tests.integration.auth_support import integration_proxy; print(integration_proxy().ping())' 2>/dev/null | grep -q pong; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              cat /tmp/freecad_bridge.log
              exit 1
            fi
            sleep 1
          done
          FREECAD_BRIDGE_CLIENT_ID=$(uv run --no-sync python -c 'from freecad_mcp.bridge.credential_store import read_credential; print(read_credential()[0])')
          FREECAD_BRIDGE_SECRET=$(uv run --no-sync python -c 'from freecad_mcp.bridge.credential_store import read_credential; print(read_credential()[1])')
          export FREECAD_BRIDGE_CLIENT_ID FREECAD_BRIDGE_SECRET
          uv run --no-sync python scripts/smoke_container.py --bridge "${{ env.IMAGE_NAME }}:test"

      - name: Cache Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache
          # Cache key based on OS and workflow file hash; refreshes when workflow changes
          key: trivy-db-${{ runner.os }}-${{ hashFiles('.github/workflows/docker.yaml') }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Scan for HIGH/CRITICAL vulnerabilities (fail build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          version: "v0.76.1"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "table"
          cache-dir: .trivy-cache
          trivyignores: ".trivyignore"

      - name: Scan for MEDIUM/LOW vulnerabilities (warning only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          version: "v0.76.1"
          severity: "MEDIUM,LOW"
          exit-code: "0"
          format: "table"
          cache-dir: .trivy-cache
          trivyignores: ".trivyignore"
        continue-on-error: true

      - name: Generate SARIF report for GitHub Security
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          version: "v0.76.1"
          format: "sarif"
          output: "trivy-results.sarif"
          cache-dir: .trivy-cache
          trivyignores: ".trivyignore"
        continue-on-error: true

      - name: Upload Trivy scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true
