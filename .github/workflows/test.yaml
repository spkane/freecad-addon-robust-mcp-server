name: Tests

on:
  push:
    branches: [main, master]
    paths:
      - "src/**/*.py"
      - "freecad/**/*.py"
      - "tests/**/*.py"
      - "package.xml"
      - "LICENSE*"
      - "NOTICE"
      - "scripts/package_workbench.py"
      - "scripts/install_workbench.py"
      - "just/install.just"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yaml"
      - ".github/actions/setup-freecad/**"
      - ".github/actions/test-cam-release/**"
      - ".github/workflows/mcp-server-release.yaml"
      - ".github/workflows/mcp-workbench-release.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**/*.py"
      - "freecad/**/*.py"
      - "tests/**/*.py"
      - "package.xml"
      - "LICENSE*"
      - "NOTICE"
      - "scripts/package_workbench.py"
      - "scripts/install_workbench.py"
      - "just/install.just"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yaml"
      - ".github/actions/setup-freecad/**"
      - ".github/actions/test-cam-release/**"
      - ".github/workflows/mcp-server-release.yaml"
      - ".github/workflows/mcp-workbench-release.yaml"
  workflow_dispatch:
  workflow_call:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cam-release-gate:
    name: Test exact CAM release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build candidate artifacts
        id: candidates
        shell: bash
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: '0.0.0'
        run: |
          set -euo pipefail
          uv build --wheel --out-dir "$RUNNER_TEMP/cam-wheel"
          VERSION=$(awk '/<workbench>/,/<\/workbench>/' package.xml | grep -o '<version>[^<]*</version>' | head -1 | sed 's/<[^>]*>//g')
          python3 scripts/package_workbench.py archives "$VERSION" "$RUNNER_TEMP/cam-workbench"
          python3 scripts/verify_workbench_archives.py "$VERSION" "$RUNNER_TEMP/cam-workbench"
          echo "archive=$RUNNER_TEMP/cam-workbench/freecad-mcp-workbench-$VERSION.zip" >> "$GITHUB_OUTPUT"
      - name: Exercise candidate artifacts
        uses: ./.github/actions/test-cam-release
        with:
          wheel-directory: ${{ runner.temp }}/cam-wheel
          workbench-archive: ${{ steps.candidates.outputs.archive }}

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Cache uv dependencies
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run type checking
        run: uv run mypy src/

  windows-credential-test:
    name: Windows Credential Manager
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Verify Credential Manager pairing
        run: uv run pytest tests/unit/test_windows_bridge_credential_store.py -v --tb=short

      - name: Verify XML-RPC slow-client deadline on Windows
        shell: pwsh
        run: |
          1..10 | ForEach-Object {
            uv run pytest tests/unit/addon/test_addon_timeouts.py -k test_xmlrpc_total_read_deadline_stops_a_slow_client -v --tb=short
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify port conflict recovery on Windows
        run: uv run pytest tests/unit/addon/test_addon_timeouts.py -k "listener_port_conflicts or partial_start_can_stop" -v --tb=short

      - name: Verify workbench installer on Windows
        run: uv run pytest tests/unit/test_workbench_installer.py -v --tb=short

      - name: Install just on Windows
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: just
          env: "false"
          export_path: "false"
          add_shims_to_path: "false"

      - name: Exercise workbench just recipe on Windows
        run: mise exec just -- uv run pytest tests/just_commands/test_install.py -k "test_workbench_installer_with_explicit_mod_directory or test_status_uses_selected_mod_directory or test_relative_mod_directory_uses_invocation_directory" -v --tb=short

  integration-test:
    name: Integration Tests (FreeCAD Headless)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup FreeCAD
        uses: ./.github/actions/setup-freecad

      - name: Install mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Cache uv dependencies
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Start FreeCAD headless with MCP bridge
        run: |
          uv run freecad-mcp --pair-bridge
          # Start FreeCAD headless with MCP bridge in background
          setsid freecadcmd freecad/RobustMCPBridge/freecad_mcp_bridge/blocking_bridge.py > /tmp/freecad_bridge.log 2>&1 &
          FREECAD_PID=$!
          echo "FREECAD_PID=$FREECAD_PID" >> "$GITHUB_ENV"

          # Wait for bridge to be ready
          echo "Waiting for FreeCAD MCP bridge to start..."
          MAX_RETRIES=60
          for i in $(seq 1 $MAX_RETRIES); do
              if curl -s --connect-timeout 1 http://localhost:9875 > /dev/null 2>&1; then
                  # Try to ping the bridge
                  if uv run python -c "from tests.integration.auth_support import integration_proxy; print(integration_proxy().ping())" 2>/dev/null | grep -q "pong"; then
                      echo "FreeCAD MCP bridge is ready!"
                      break
                  fi
              fi
              if [ "$i" -eq "$MAX_RETRIES" ]; then
                  echo "ERROR: FreeCAD MCP bridge did not start"
                  echo "=== Bridge Log ==="
                  cat /tmp/freecad_bridge.log || true
                  kill "$FREECAD_PID" 2>/dev/null || true
                  exit 1
              fi
              sleep 1
          done

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ -v --tb=short -x

      - name: Stop FreeCAD
        if: always()
        run: |
          # Clean up FreeCAD process
          if [ -n "$FREECAD_PID" ]; then
              kill -- "-$FREECAD_PID" 2>/dev/null || kill "$FREECAD_PID" 2>/dev/null || true
          fi
          # Show bridge log on failure for debugging
          if [ -f /tmp/freecad_bridge.log ]; then
              echo "=== FreeCAD Bridge Log ==="
              cat /tmp/freecad_bridge.log
          fi
